<!DOCTYPE html>
<html>
<head>
    <title>Grid Maker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Menu Buttons -->
    <div class="topsection">
        <button onclick="addR()">Add Row</button>
        <button onclick="addC()">Add Col</button>
        <button onclick="removeR()">Remove Row</button>
        <button onclick="removeC()">Remove Col</button>
        <button onclick="fillU()">Fill All Uncolored</button>
        <button onclick="fillAll()">Fill All</button>
        <button onclick="clearAll()">Clear Color</button>
        <button onclick="clearAllCells()">Clear Cells</button>
        <select onchange="selectColor()" id="selectedColorId">
            <option value="SELECT">SELECT</option>
            <option value="#A11C0F">Red</option>
            <option value="#000083">Blue</option>
            <option value="#006B3D">Green</option>
            <option value="#FDCC0C">Yellow</option>
        </select> 
    </div>
    <hr style="background-color: rgb(63, 63, 63); color: rgb(63, 63, 63); border-width: 0; height: 2px;">
    <!-- Grid Table -->
    <table id="grid">
    </table>
    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
